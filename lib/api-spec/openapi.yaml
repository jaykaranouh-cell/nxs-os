openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Nexus AI Business Orchestration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead management and qualification
  - name: agents
    description: Department agent status, tasks, and logs
  - name: memory
    description: Shared company memory entries — the core intelligence layer
  - name: chat
    description: CEO Orchestrator chat messages
  - name: ideas
    description: Proactive agent ideas
  - name: reports
    description: Business metrics and reporting
  - name: decisions
    description: Key business decisions log
  - name: system-context
    description: Strategic Brain — persistent context for the Orchestrator
  - name: opportunities
    description: Opportunity Engine — tracked business opportunities
  - name: daily-plan
    description: Daily Execution Plan — AI-generated mission, actions, risks, and priorities for the day
  - name: morning-brief
    description: Morning Brief — AI Chief of Staff briefing generated from all live data sources

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── LEADS ───────────────────────────────────────────────────────────────────
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}/qualify:
    post:
      operationId: qualifyLead
      tags: [leads]
      summary: Qualify a lead and route to appropriate agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadQualification"
      responses:
        "200":
          description: Qualification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationResult"

  /leads/stats/summary:
    get:
      operationId: getLeadStats
      tags: [leads]
      summary: Get lead statistics
      responses:
        "200":
          description: Lead stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStats"

  # ─── AGENTS ──────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents with live status
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

  /objectives:
    get:
      operationId: listObjectives
      tags: [objectives]
      summary: All objectives with their steps
      responses:
        "200":
          description: Objectives
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Objective" }
    post:
      operationId: createObjective
      tags: [objectives]
      summary: Create an objective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectiveInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: integer } }

  /objectives/{id}/steps:
    post:
      operationId: addObjectiveStep
      tags: [objectives]
      summary: Add a step
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectiveStepInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  /objectives/{id}/progress:
    post:
      operationId: updateObjectiveProgress
      tags: [objectives]
      summary: Update progress, status, or complete a step
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectiveProgressInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }

  /actions/reversible:
    get:
      operationId: listReversibleActions
      tags: [actions]
      summary: Recent undoable agent actions
      responses:
        "200":
          description: Reversible actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReversibleAction"

  /actions/{id}/undo:
    post:
      operationId: undoAction
      tags: [actions]
      summary: Revert a recorded agent action
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reverted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reverted: { type: string }

  /home/digest:
    get:
      operationId: getHomeDigest
      tags: [home]
      summary: Activity since last visit plus outstanding items
      responses:
        "200":
          description: Home digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeDigest"

  /home/seen:
    post:
      operationId: markHomeSeen
      tags: [home]
      summary: Mark the home digest as seen up to now
      responses:
        "200":
          description: Updated last-seen
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastSeen:
                    type: string

  /agents/messages:
    get:
      operationId: listAgentMessages
      tags: [agents]
      summary: Inter-agent team mailbox, newest first
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMessage"

  /agents/{agentId}/profile:
    get:
      operationId: getAgentProfile
      tags: [agents]
      summary: An agent's instructions, skills, knowledge, and private memory
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"

  /agents/{agentId}/instructions:
    put:
      operationId: setAgentInstructions
      tags: [agents]
      summary: Set an agent's standing instructions
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInstructionsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /agents/{agentId}/kb:
    post:
      operationId: addAgentKb
      tags: [agents]
      summary: Add a skill or knowledge entry to an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentKbInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }

  /agents/{agentId}/kb/{kbId}:
    delete:
      operationId: deleteAgentKb
      tags: [agents]
      summary: Delete a skill or knowledge entry
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: kbId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /agents/{agentId}/ask:
    post:
      operationId: askAgent
      tags: [agents]
      summary: Ask a department agent a question directly
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: The agent's reply (also posted to the team channel)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessage"

  /agents/activity/recent:
    get:
      operationId: getRecentAgentActivity
      tags: [agents]
      summary: Get recent agent activity logs
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentLog"

  /agents/{agentId}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get a specific agent with task details
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{agentId}/tasks:
    get:
      operationId: listAgentTasks
      tags: [agents]
      summary: List tasks for an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTask"
    post:
      operationId: createAgentTask
      tags: [agents]
      summary: Create a task for an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"

  /agents/{agentId}/tasks/{taskId}:
    patch:
      operationId: updateAgentTask
      tags: [agents]
      summary: Update an agent task
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"

  /agents/{agentId}/logs:
    get:
      operationId: getAgentLogs
      tags: [agents]
      summary: Get logs for an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentLog"

  # ─── MEMORY ──────────────────────────────────────────────────────────────────
  /memory:
    get:
      operationId: listMemoryEntries
      tags: [memory]
      summary: List memory entries with optional filtering
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Memory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryEntry"
    post:
      operationId: createMemoryEntry
      tags: [memory]
      summary: Create a new memory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryInput"
      responses:
        "201":
          description: Created memory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"

  /memory/briefing:
    get:
      operationId: getMemoryBriefing
      tags: [memory]
      summary: Get AI-synthesized morning executive briefing from memory
      responses:
        "200":
          description: Morning briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryBriefing"

  /memory/agent-status:
    get:
      operationId: getMemoryAgentStatus
      tags: [memory]
      summary: Get Memory Agent operational status
      responses:
        "200":
          description: Memory Agent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryAgentStatus"

  /memory/categories/summary:
    get:
      operationId: getMemoryCategorySummary
      tags: [memory]
      summary: Get count of memory entries by category
      responses:
        "200":
          description: Category summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"

  /memory/connections:
    post:
      operationId: createMemoryConnection
      tags: [memory]
      summary: Connect two memory entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryConnectionInput"
      responses:
        "201":
          description: Created connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryConnection"

  /memory/proposals:
    get:
      operationId: listMemoryProposals
      tags: [memory]
      summary: List auto-captured memory proposals
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryProposal"

  /memory/proposals/{id}/approve:
    post:
      operationId: approveMemoryProposal
      tags: [memory]
      summary: Approve a proposal, creating a real memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProposal"

  /memory/proposals/{id}/reject:
    post:
      operationId: rejectMemoryProposal
      tags: [memory]
      summary: Reject a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProposal"

  /memory/{id}:
    get:
      operationId: getMemoryEntry
      tags: [memory]
      summary: Get a memory entry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Memory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
    patch:
      operationId: updateMemoryEntry
      tags: [memory]
      summary: Update a memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryUpdate"
      responses:
        "200":
          description: Updated memory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
    delete:
      operationId: deleteMemoryEntry
      tags: [memory]
      summary: Delete a memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /memory/{id}/connections:
    get:
      operationId: getMemoryConnections
      tags: [memory]
      summary: Get all connections for a memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connected memory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectedMemory"

  # ─── CHAT ────────────────────────────────────────────────────────────────────
  /chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: List orchestrator chat history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the CEO Orchestrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Message sent and orchestrator response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  # ─── IDEAS ───────────────────────────────────────────────────────────────────
  /ideas:
    get:
      operationId: listIdeas
      tags: [ideas]
      summary: List proactive agent ideas
      parameters:
        - name: agentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
    post:
      operationId: createIdea
      tags: [ideas]
      summary: Submit a new agent idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "201":
          description: Created idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"

  /ideas/{id}:
    patch:
      operationId: updateIdea
      tags: [ideas]
      summary: Update idea status (approve/reject/implement)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaUpdate"
      responses:
        "200":
          description: Updated idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"

  /ideas/pending/count:
    get:
      operationId: getPendingIdeasCount
      tags: [ideas]
      summary: Get count of pending ideas
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCount"

  # ─── REPORTS ─────────────────────────────────────────────────────────────────
  /reports/metrics:
    get:
      operationId: getDashboardMetrics
      tags: [reports]
      summary: Get key business metrics for dashboard
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"

  /reports/pipeline:
    get:
      operationId: getPipelineReport
      tags: [reports]
      summary: Get sales pipeline report
      responses:
        "200":
          description: Pipeline report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineReport"

  /reports/usage:
    get:
      operationId: getLlmUsageReport
      tags: [reports]
      summary: LLM token usage and estimated cost (last 30 days)
      responses:
        "200":
          description: Usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmUsageReport"

  /reports/finance:
    get:
      operationId: getFinanceReport
      tags: [reports]
      summary: Get finance summary report
      responses:
        "200":
          description: Finance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReport"

  # ─── DECISIONS ───────────────────────────────────────────────────────────────
  /decisions:
    get:
      operationId: listDecisions
      tags: [decisions]
      summary: List key business decisions
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Decision"
    post:
      operationId: createDecision
      tags: [decisions]
      summary: Log a key business decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "201":
          description: Created decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"

  # ─── SYSTEM CONTEXT (Strategic Brain) ───────────────────────────────────────
  /system-context:
    get:
      operationId: getSystemContext
      tags: [system-context]
      summary: Get the full Strategic Brain context
      responses:
        "200":
          description: System context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemContext"
    put:
      operationId: upsertSystemContext
      tags: [system-context]
      summary: Save Strategic Brain data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemContextInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemContext"

  # ─── SETUP CONTEXT ────────────────────────────────────────────────────────────
  /setup-context:
    get:
      operationId: getSetupContext
      tags: [system-context]
      summary: Get all business context setup sections with completion status
      responses:
        "200":
          description: Setup context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupContext"

  /setup-context/{section}:
    put:
      operationId: updateSetupSection
      tags: [system-context]
      summary: Update a specific setup section
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupSectionData"
      responses:
        "200":
          description: Section saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSectionResponse"

  # ─── OPPORTUNITIES ────────────────────────────────────────────────────────────
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List all tracked opportunities
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpportunityItem"
    post:
      operationId: createOpportunity
      tags: [opportunities]
      summary: Create a new opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityItem"

  /opportunities/{id}:
    patch:
      operationId: updateOpportunity
      tags: [opportunities]
      summary: Update an opportunity (status, notes, priority)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityItem"
    delete:
      operationId: deleteOpportunity
      tags: [opportunities]
      summary: Delete an opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── DAILY EXECUTION PLAN ────────────────────────────────────────────────────
  /daily-plan:
    get:
      operationId: getDailyPlan
      tags: [daily-plan]
      summary: Generate today's AI-driven execution plan from all memory, goals, risks, and opportunities
      responses:
        "200":
          description: Daily execution plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPlan"

  /morning-brief:
    get:
      operationId: getMorningBrief
      tags: [morning-brief]
      summary: Get the AI Chief of Staff morning brief — generated from all live data sources, cached daily
      responses:
        "200":
          description: Morning brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorningBrief"

  /morning-brief/refresh:
    post:
      operationId: refreshMorningBrief
      tags: [morning-brief]
      summary: Force-regenerate the morning brief from current data
      responses:
        "200":
          description: Freshly generated morning brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorningBrief"

